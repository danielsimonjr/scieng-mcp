name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (the user runs it
        # locally on Windows), but CI was Linux-only — i.e. it never tested the OS
        # the server actually ships on.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # The committed bundle must equal a fresh build. A change under src/ that nobody built fails here.
      # A build that adds an uncommitted file also fails here.
      - name: Bundle is current
        shell: bash
        run: |
          bun run bundle
          if [ -n "$(git status --porcelain -- plugin/bundle)" ]; then
            git status --porcelain -- plugin/bundle
            git diff --stat -- plugin/bundle
            echo "FAIL: plugin/bundle differs from a fresh build. Run bun run bundle and commit the result."
            exit 1
          fi
          echo "PASS: plugin/bundle matches a fresh build"
      # --if-present: run each stage only if the repo defines it (universal template).
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      - run: bun run --if-present test
      - run: bun run --if-present build

      # Production runtime is NODE; Bun is the dev toolchain. Every step above runs under
      # Bun, so without this the shipped artifact is never executed by the runtime that
      # actually runs it. The six repos reverted during the Bun migration all failed there:
      # on deps Bun's non-hoisted node_modules resolved and Node did not.
      #
      # Fails on a throw, a syntax error, or an unresolvable import. A server that
      # self-starts on import PASSES after 5s -- it started and did not crash. Verified
      # failure-capable before adoption (corrupt artifact -> exit 1; missing dep -> exit 1).
      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./plugin/bundle/index.mjs";
            const t = setTimeout(() => {
              console.log("PASS: self-started under Node, no crash within 5s");
              process.exit(0);
            }, 5000);
            import(entry).then(() => {
              clearTimeout(t);
              console.log("PASS: loaded cleanly under Node");
              process.exit(0);
            }).catch((e) => {
              clearTimeout(t);
              console.error("FAIL: " + entry + " did not load under Node -> " + e.message);
              process.exit(1);
            });
          '

  architecture-docs:
    # This name is the branch protection context when the check is made required. Do not rename it.
    name: Architecture docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install repo-tools (pinned)
        run: npm install --global --ignore-scripts --no-audit --no-fund @danielsimonjr/repo-tools@2.5.0

      - name: Architecture documents match the source graph
        run: repo-tools check . --docs=docs/architecture

      - name: Exported symbols have doc comments
        run: repo-tools docs check src
